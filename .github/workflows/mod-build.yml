name: Build, Sign, and Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Release
        run: ./gradlew assembleFdroidRelease
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_GITHUB_TOKEN }}

      - name: Find Release APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/fdroid/release -name "*.apk" -print0 | xargs -0 -n1 basename)
          echo "apk_file=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_path=app/build/outputs/apk/fdroid/release/$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_file_no_ext=${APK_PATH%.apk}" >> $GITHUB_OUTPUT

      - name: Sign Release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/fdroid/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }} # Store signing key as a base64 encoded secret
          alias: ${{ secrets.ALIAS }} # Store the alias in secrets
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }} # Store keystore password in secrets
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: ${{steps.sign_app.outputs.signedReleaseFile}}
          generate_release_notes: true
